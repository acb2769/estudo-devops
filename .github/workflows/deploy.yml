name: Continuous Integration
on:
  push:
    branches:["main", "master"]
  pull_request:
      branches:["main"]

  jobs:
     validacao-estatica:
     runs-on: ubuntu-latest
     steps:

        - name: Checkout do codigo
          uses:actitions/checkout@v3

        - name: Verificar arquivos essenciais
            run:|
            test -f index.html && echo "HTML.encontado!"
            test -f style.css && echo ?"Css encontrado!"