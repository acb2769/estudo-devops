name: Continuous Integration

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main"]

jobs:
  validacao-estatica:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Verificar arquivos essenciais
        run: |
          test -f index.html && echo "HTML encontrado!"
          test -f style.css && echo "Css encontrado!"

      - name: Verificar memoria
        run: isb_release -a && free -html

      - name: Validar sintaxe do HTML
        uses: htmlhint/HTMLHint/.github/actions/htmlhint@master
        with: 
          target_pattern: 'index.html'

      - name: checar arquivos estaticos
        run: | 
          ls -R
          echo "Todos os arquivos foram carregados corretamente!" 

    